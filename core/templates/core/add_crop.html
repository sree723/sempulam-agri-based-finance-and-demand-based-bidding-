{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Sempulam | Add Crop</title>

    <link rel="stylesheet"
          href="{% static 'core/style.css' %}">

</head>

<body>

<div class="form-page">

    <div class="form-card">

        <div class="form-header">

            <div class="brand">
                Sempulam
            </div>

            <h1>Add Crop</h1>

            <p>
                Add cultivation details for
                <strong>{{ land.location }}</strong>
            </p>

        </div>


        <form method="POST">

            {% csrf_token %}

            <div class="form-fields">

                {{ form.as_p }}

            </div>

            <button type="submit"
                    class="form-submit-btn">
                Add Crop
            </button>

        </form>


        <a href="{% url 'farmer_dashboard' %}"
           class="back-link">
            ← Back to Dashboard
        </a>

    </div>

</div>

</body>

</html>
